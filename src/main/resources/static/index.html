<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PayPilot Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <header>
        <h1>PayPilot</h1>
        <p>Payment Intelligence Dashboard</p>
    </header>

    <section class="dashboard">

        <div class="card">
            <h3>Total Payments</h3>
            <p id="totalPayments">0</p>
        </div>

        <div class="card">
            <h3>Successful</h3>
            <p id="successfulPayments">0</p>
        </div>

        <div class="card">
            <h3>Failed</h3>
            <p id="failedPayments">0</p>
        </div>

        <div class="card">
            <h3>Failure Rate</h3>
            <p id="failureRate">0%</p>
        </div>

    </section>

    <section class="payments">

        <h2>Payment History</h2>

        <table>

            <thead>
            <tr>
                <th>ID</th>
                <th>Amount</th>
                <th>Method</th>
                <th>Status</th>
                <th>Failure Reason</th>
                <th>Recommendation</th>
            </tr>
            </thead>

            <tbody id="paymentTable">
            </tbody>

        </table>

    </section>

</div>

<script src="script.js"></script>

</body>
</html>
